global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "service-registry"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["service-registry:8761"]

  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "news-ingestion"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["news-ingestion:8081"]

  - job_name: "market-data"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["market-data:8082"]

  - job_name: "social-media"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["social-media:8083"]

  - job_name: "chat-api"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["chat-api:8085"]

  - job_name: "sentiment-analysis"
    static_configs:
      - targets: ["sentiment-analysis:8086"]

  - job_name: "market-data-processor"
    static_configs:
      - targets: ["market-data-processor:8087"]

server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: news-ingestion
          uri: lb://news-ingestion-service
          predicates:
            - Path=/api/news/**
        - id: market-data
          uri: lb://market-data-service
          predicates:
            - Path=/api/market/**
        - id: social-media
          uri: lb://social-media-service
          predicates:
            - Path=/api/social/**
        - id: chat-api
          uri: lb://chat-api-service
          predicates:
            - Path=/api/chat/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

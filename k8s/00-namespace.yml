---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: market-analysis
---
# ConfigMap – shared environment
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-config
  namespace: market-analysis
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  EUREKA_URL: "http://service-registry:8761/eureka/"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "marketdb"
---
# Secret – credentials
apiVersion: v1
kind: Secret
metadata:
  name: market-secrets
  namespace: market-analysis
type: Opaque
stringData:
  DB_USER: market
  DB_PASS: market

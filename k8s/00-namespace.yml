---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: market-analysis
---
# ConfigMap – shared environment
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-config
  namespace: market-analysis
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "marketdb"
---
# Secret – credentials (populate DB_USER, DB_PASS, JWT_SECRET, REDIS_PASSWORD via external secrets manager or sealed-secrets)
apiVersion: v1
kind: Secret
metadata:
  name: market-secrets
  namespace: market-analysis
type: Opaque
stringData:
  DB_USER: ""
  DB_PASS: ""
  JWT_SECRET: ""
  REDIS_PASSWORD: ""

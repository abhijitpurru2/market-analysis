apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DB_USER: {{ .Values.credentials.dbUser | quote }}
  DB_PASS: {{ .Values.credentials.dbPass | quote }}
  JWT_SECRET: {{ .Values.credentials.jwtSecret | quote }}
  REDIS_PASSWORD: {{ .Values.credentials.redisPassword | quote }}

replicaCount:
  apiGateway: 2
  marketData: 2
  chatApi: 2
  chatFrontend: 2
  newsIngestion: 1
  socialMedia: 1
  sentimentAnalysis: 1
  marketDataProcessor: 1

image:
  registry: ""
  tag: latest
  pullPolicy: IfNotPresent

apiGateway:
  port: 8080

kafka:
  bootstrapServers: kafka:9092

postgres:
  host: postgres
  port: 5432
  database: marketdb

redis:
  host: redis
  port: 6379

# Credentials are intentionally empty – supply via --set or a Secrets Manager integration.
# Example: helm install market-analysis ./helm/market-analysis \
#   --set credentials.dbUser=<value> \
#   --set credentials.dbPass=<value> \
#   --set credentials.jwtSecret=$(openssl rand -base64 32) \
#   --set credentials.redisPassword=<value>
credentials:
  dbUser: ""
  dbPass: ""
  jwtSecret: ""
  redisPassword: ""

ingress:
  enabled: false
  className: nginx
  host: market-analysis.local

prometheus:
  enabled: true

grafana:
  enabled: true
  adminPassword: ""
